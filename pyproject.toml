[project]
name = "realm"
version = "0.19.2"
description = "Collective Sentiment Simulation Platform — time-seeded trait diversification + LLM-as-partner scenario analysis"
authors = [{ name = "Suvar Ergun" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
# Sprint 20 hygiene pass: this list now matches what realm/ actually
# imports. networkx (simulation/network.py), feedparser (ingestion),
# httpx (web_researcher + polymarket client — previously an UNDECLARED
# transitive dep), fastapi/uvicorn (the v2 API is core product) moved in
# from optional extras; pandas/aiohttp/requests/timezonefinder dropped
# (imported nowhere — they arrive transitively where needed).
dependencies = [
    # Phase 1 ephemeris backend. Pure-Python + compiled wheels on all platforms.
    "skyfield>=1.50",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "faker>=20.0",
    "networkx>=3.2",
    "feedparser>=6.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
# Preferred production ephemeris (needs MSVC Build Tools on Windows+Py3.12).
kerykeion = ["kerykeion>=5.12"]
# LLM backends (floor matches the tested openai 2.x line).
llm = ["openai>=2.0", "ollama>=0.4"]
dev = ["pytest>=8.0", "pytest-asyncio", "pytest-cov", "ruff", "black"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["realm*"]

[tool.pytest.ini_options]
testpaths = ["tests", "realm"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
filterwarnings = [
    # Kerykeion v5 → v6 deprecations — not our concern until we upgrade.
    "ignore::DeprecationWarning:kerykeion",
    "ignore::pydantic.PydanticDeprecatedSince211",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
