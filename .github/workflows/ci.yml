name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[kerykeion,llm,dev]"

      # de421.bsp is gitignored (16 MB binary); the ephemeris engines
      # expect it at the repo root. Cache it across runs.
      - name: Cache JPL ephemeris
        id: ephemeris-cache
        uses: actions/cache@v4
        with:
          path: de421.bsp
          key: de421-bsp

      - name: Download JPL ephemeris
        if: steps.ephemeris-cache.outputs.cache-hit != 'true'
        run: curl -fsSL -o de421.bsp https://ssd.jpl.nasa.gov/ftp/eph/planets/bsp/de421.bsp

      - name: Ruff
        run: ruff check .

      - name: Tests
        # Hermetic by design: conftest.py clears REALM_LLM_CATEGORY_BACKEND,
        # no API keys are present in CI, and LLM paths degrade gracefully.
        run: pytest -q
